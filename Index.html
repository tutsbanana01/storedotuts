
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Store</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
    }

    header {
      background: #151c31;
      padding: 25px;
      text-align: center;
      border-bottom: 2px solid #7657ff;
    }

    header h1 {
      color: #a995ff;
      font-size: 30px;
    }

    header p {
      margin-top: 8px;
      color: #bbb;
    }

    .container {
      max-width: 950px;
      margin: 50px auto;
      padding: 20px;
    }

    .container h2 {
      text-align: center;
      margin-bottom: 35px;
      font-size: 28px;
    }

    .produtos {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
    }

    .produto {
      background: #171f36;
      border: 1px solid #343d5c;
      border-radius: 15px;
      width: 280px;
      padding: 25px;
      text-align: center;
    }

    .logo {
      height: 130px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 28px;
      font-weight: bold;
    }

    .hbo {
      background: linear-gradient(135deg, #092b77, #7938d0);
    }

    .prime {
      background: linear-gradient(135deg, #07334d, #168bc1);
    }

    .produto h3 {
      font-size: 23px;
      margin-bottom: 12px;
    }

    .produto p {
      color: #c3c9d9;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .estoque {
      color: #ff687b;
      font-weight: bold;
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #42485a;
      color: #c0c4ce;
      border: none;
      border-radius: 8px;
      cursor: not-allowed;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #999;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <header>
    <h1>STREAM STORE</h1>
    <p>Sua loja de entretenimento digital</p>
  </header>

  <main class="container">
    <h2>Nossos produtos</h2>

    <div class="produtos">

      <!-- HBO MAX -->
      <div class="produto">
        <div class="logo hbo">HBO MAX</div>
        <h3>HBO Max</h3>
        <p>Filmes, séries e conteúdos exclusivos.</p>
        <div class="estoque">● 0 em estoque</div>
        <button disabled>Produto indisponível</button>
      </div>

      <!-- PRIME VIDEO -->
      <div class="produto">
        <div class="logo prime">prime video</div>
        <h3>Prime Video</h3>
        <p>Filmes, séries e produções originais.</p>
        <div class="estoque">● 0 em estoque</div>
        <button disabled>Produto indisponível</button>
      </div>

    </div>
  </main>

  <footer>
    © 2026 Stream Store — Loja demonstrativa.
  </footer>

</body>
</html>
